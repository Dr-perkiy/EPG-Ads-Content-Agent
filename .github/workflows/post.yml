name: EPG content

on:
  schedule:
    # Twice a day on weekdays: a morning window and an evening window.
    # GitHub treats schedules as best effort and DROPS runs under load, and
    # on-the-hour times are the most congested, so each window fires several
    # times at an odd minute. The MIN_GAP_HOURS guard in build.js means only
    # the first attempt that actually lands does the posting; the rest skip.
    - cron: '17 13,14,15 * * 1-5'
    - cron: '17 21,22,23 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate and render but publish nothing (uploads slides as an artifact to review)'
        type: boolean
        default: true
      platforms:
        description: 'Where to publish'
        type: choice
        options: ['instagram,facebook', 'instagram', 'facebook', 'instagram,facebook,linkedin', 'linkedin']
        default: 'instagram,facebook'

concurrency:
  group: epg-content-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Manual runs default to a dry run; the weekly schedule publishes for real.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'instagram,facebook' }}
      AGENT_ENABLED: ${{ vars.AGENT_ENABLED || 'true' }}
      # Manual runs force a post. Scheduled runs skip if one already went out
      # recently, which is what makes the repeated cron attempts safe.
      MIN_GAP_HOURS: ${{ github.event_name == 'workflow_dispatch' && '0' || '5' }}
      IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Chromium is installed for Puppeteer
        run: npx puppeteer browsers install chrome

      # Nicer display fonts if available, but never let apt hang or fail the run.
      # The runner already ships with usable fonts (DejaVu/Liberation), so this
      # is best-effort only: hard-timeout each step and continue regardless.
      - name: Install fonts (best effort)
        continue-on-error: true
        run: |
          sudo timeout 90 apt-get update -qq || true
          sudo DEBIAN_FRONTEND=noninteractive timeout 90 apt-get install -y -qq --no-install-recommends fonts-liberation fonts-dejavu-core || true

      # Phase 1: pick topic, generate copy, guardrail-check, render slides + PDF.
      - name: Build this week's content
        id: build
        run: node src/build.js

      # Instagram fetches each image from a public raw URL, so the rendered
      # slides must be committed first and the post pinned to that commit.
      - name: Commit rendered slides
        id: commit
        run: |
          git config user.name  "epg-content-agent"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain output/ state/)" ]; then
            git add output/ state/
            git commit -m "chore: staged weekly content [skip ci]"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload slides for review
        uses: actions/upload-artifact@v4
        with:
          name: carousel-${{ github.run_id }}
          path: output/
          if-no-files-found: warn

      # Phase 2: publish the staged carousel. Skipped on dry runs.
      - name: Publish
        if: env.DRY_RUN == 'false' && steps.build.outputs.built == 'true'
        env:
          IMAGE_SHA: ${{ steps.commit.outputs.sha }}
        run: node src/publish.js

      - name: Record the run
        if: always()
        run: |
          git config user.name  "epg-content-agent"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain state/)" ]; then
            git add state/
            git commit -m "chore: record run [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
